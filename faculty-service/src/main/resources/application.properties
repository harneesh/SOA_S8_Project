spring.application.name=faculty-service
server.port=8081

# ---------------- MySQL database ----------------
# The database "facultysync_db" is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/facultysync_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Change these to your MySQL username / password
spring.datasource.username=root
spring.datasource.password=12345

# Hibernate creates/updates the tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
